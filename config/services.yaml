parameters:
  contao_issue_service.storage_dir: '%kernel.project_dir%/var/issue-attachments'
  # Empty: use the Contao administrator email; may be overridden per installation.
  contao_issue_service.mail_from: ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Diversworld\ContaoIssueServiceBundle\:
    resource: '../src/'
    exclude:
      - '../src/ContaoManager/'
      - '../src/ContaoIssueServiceBundle.php'
      - '../src/DependencyInjection/'
      - '../src/Domain/Dto/'
      - '../src/Domain/Enum/'

  Diversworld\ContaoIssueServiceBundle\Infrastructure\LocalAttachmentStorage:
    arguments:
      $storageDir: '%contao_issue_service.storage_dir%'

  Diversworld\ContaoIssueServiceBundle\Infrastructure\AttachmentStorageInterface:
    alias: Diversworld\ContaoIssueServiceBundle\Infrastructure\LocalAttachmentStorage

  Diversworld\ContaoIssueServiceBundle\Application\NotificationService:
    arguments:
      $fromAddress: '%contao_issue_service.mail_from%'

  Diversworld\ContaoIssueServiceBundle\Application\SettingsService:
    public: true

  Diversworld\ContaoIssueServiceBundle\Backend\IssueDashboardModule:
    public: true

  # DC_Table resolves this callback directly from its DCA registration.
  Diversworld\ContaoIssueServiceBundle\EventListener\DataContainer\IssueDcaCallbacks:
    public: true

  Diversworld\ContaoIssueServiceBundle\EventListener\DataContainer\IssueSettingsDcaCallbacks:
    public: true

  Diversworld\ContaoIssueServiceBundle\EventListener\DataContainer\AttachmentDirectoryCallback:
    public: true
